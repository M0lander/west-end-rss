name: Uppdatera lunchflöde

on:
  schedule:
    # Tider i UTC. 05:15 = 07:15 sommartid / 06:15 vintertid.
    # Andra körningen fångar menyer som läggs upp sent på måndagen.
    - cron: "15 5 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch: {}   # knapp för manuell körning under Actions-fliken

permissions:
  contents: write

concurrency:
  group: lunch-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bygg flödet
        run: >
          python scrape.py --out docs
          --feed-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"

      - name: Committa om menyn ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Ingen ändring."
          else
            git commit -m "Lunchmeny $(TZ=Europe/Stockholm date +%F)"
            git push
          fi
